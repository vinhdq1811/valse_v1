            name: "Sarah M"
            role: "CEO của Tech Solutions"
            quote: "Khóa học thực sự là bước ngoặt! Nó giúp tôi hiểu sâu hơn về lý thuyết âm nhạc và kỹ thuật biểu diễn. Rất đáng để theo học!"
          s2:
            name: "David H"
            role: "CFO của Green Energy Corp"
            quote: "Tôi rất thích phương pháp thực hành của khóa học. Các giảng viên cực kỳ tài năng và tôi chưa bao giờ tự tin vào khả năng âm nhạc của mình như lúc này."
          s3:
            name: "Lisa R."
            role: "Giám đốc HealthCare"
            quote: "Từ sáng tác nhạc đến làm chủ nhạc cụ, khóa học này bao phủ tất cả! Các bài học được cấu trúc chặt chẽ và rất hấp dẫn."
          s4:
            name: "Olivia Bennett"
            role: "CEO công ty Marketing"
            quote: "Khóa học chuyên sâu đã giúp tôi cải thiện cả kỹ năng biểu diễn lẫn kiến thức sản xuất âm nhạc. Hoàn hảo cho người muốn theo đuổi âm nhạc!"
          s5:
            name: "Ethan Marshall"
            role: "Chủ cửa hàng Nancy's Boutique"
            quote: "Dù bạn là người mới bắt đầu hay đã nâng cao, khóa học đều có điều phù hợp cho mọi người. Sự linh hoạt và hỗ trợ thật tuyệt vời!"
